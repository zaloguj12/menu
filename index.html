<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szlachecka Kuchnia — Pan Tadeusz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0f0d0b;
      --bg-card:      #141210;
      --text:         #f0e8d8;
      --text-muted:   #7a6e60;
      --gold:         #c9a84c;
      --gold-dim:     #7a5e28;
      --border:       #242018;
      --border-gold:  rgba(201,168,76,0.25);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ===================== HEADER ===================== */
    header {
      text-align: center;
      padding: 88px 40px 64px;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    header::after {
      content: '';
      position: absolute;
      top: -120px; left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(56px, 9vw, 108px);
      font-weight: 300;
      line-height: 0.88;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 20px;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
      display: block;
    }

    .header-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 24px auto 20px;
      width: fit-content;
    }

    .header-rule span {
      display: block;
      width: 48px;
      height: 1px;
      background: var(--gold-dim);
    }

    .header-rule i {
      color: var(--gold);
      font-size: 10px;
      font-style: normal;
    }

    .header-subtitle {
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ===================== NAV ===================== */
    nav#main-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,13,11,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 40px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    nav#main-nav::-webkit-scrollbar { display: none; }

    .nav-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      padding: 22px 24px;
      cursor: pointer;
      position: relative;
      transition: color 0.25s;
    }

    .nav-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      right: 50%;
      height: 1px;
      background: var(--gold);
      transition: left 0.3s ease, right 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--text);
    }

    .nav-btn.active {
      color: var(--gold);
    }

    .nav-btn.active::after {
      left: 0;
      right: 0;
    }

    /* ===================== SUB-NAV ===================== */
    #sub-nav {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 14px 40px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }

    #sub-nav.visible {
      display: flex;
    }

    .sub-label {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 8px;
    }

    .sub-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'Jost', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .sub-btn:hover {
      border-color: var(--gold-dim);
      color: var(--text);
    }

    .sub-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ===================== MAIN CONTENT ===================== */
    main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 64px 40px 80px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 56px;
    }

    .category-header h2 {
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }

    .category-header-line {
      flex: 1;
      height: 1px;
      background: var(--border-gold);
    }

    /* ===================== DISH CARD ===================== */
    .dish-card {
      margin-bottom: 72px;
      padding-bottom: 72px;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.4s ease both;
    }

    .dish-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .dish-card:nth-child(2) { animation-delay: 0.05s; }
    .dish-card:nth-child(3) { animation-delay: 0.10s; }
    .dish-card:nth-child(4) { animation-delay: 0.15s; }
    .dish-card:nth-child(5) { animation-delay: 0.20s; }

    .dish-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 4.5vw, 58px);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 36px;
    }

    .dish-body {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 56px;
      align-items: start;
    }

    .dish-left {
      display: flex;
      flex-direction: column;
      min-height: 240px;
    }

    .dish-description {
      font-size: 15px;
      line-height: 1.85;
      color: var(--text);
      flex: 1;
    }

    .dish-reference {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .dish-reference::before {
      content: '— ';
      color: var(--gold-dim);
    }

    .dish-image-wrap {
      position: relative;
      overflow: hidden;
    }

    .dish-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      filter: brightness(0.82) saturate(0.85);
      transition: filter 0.5s ease, transform 0.5s ease;
    }

    .dish-image-wrap:hover .dish-image {
      filter: brightness(1) saturate(1);
      transform: scale(1.02);
    }

    .dish-image-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
    }

    .dish-image-placeholder span {
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* ===================== STATES ===================== */
    .loading-state {
      text-align: center;
      padding: 100px 20px;
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }

    .empty-state {
      text-align: center;
      padding: 100px 20px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-style: italic;
      color: var(--text-muted);
    }

    /* ===================== FOOTER ===================== */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px;
      text-align: center;
    }

    .footer-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .footer-rule span {
      display: block;
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
    }

    .footer-rule i {
      color: var(--gold-dim);
      font-size: 10px;
      font-style: normal;
    }

    footer p {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 820px) {
      header    { padding: 60px 24px 48px; }
      nav#main-nav { padding: 0 16px; }
      #sub-nav  { padding: 12px 16px; }
      main      { padding: 48px 24px 60px; }

      .dish-body {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .dish-image-wrap,
      .dish-image-placeholder {
        order: -1;
      }

      .dish-left { min-height: unset; }
    }

    @media (max-width: 480px) {
      .nav-btn { padding: 20px 16px; font-size: 9px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- HEADER                                                        -->
  <!-- ============================================================ -->
  <header>
    <div class="header-eyebrow">Adam Mickiewicz</div>
    <h1>Szlachecka<em>Kuchnia</em></h1>
    <div class="header-rule">
      <span></span><i>&#10022;</i><span></span>
    </div>
    <div class="header-subtitle">Menu inspirowane Panem Tadeuszem</div>
  </header>

  <!-- ============================================================ -->
  <!-- NAVIGATION                                                    -->
  <!-- ============================================================ -->
  <nav id="main-nav" aria-label="Kategorie">
    <button class="nav-btn active" data-category="zupy">Zupy</button>
    <button class="nav-btn" data-category="dania-miesne">Dania Mięsne</button>
    <button class="nav-btn" data-category="ryby">Ryby</button>
    <button class="nav-btn" data-category="wedliny">Wędliny</button>
    <button class="nav-btn" data-category="napoje">Napoje</button>
    <button class="nav-btn" data-category="desery">Desery</button>
  </nav>

  <div id="sub-nav" aria-label="Podkategoria napojow">
    <span class="sub-label">Filtr:</span>
    <button class="sub-btn active" data-sub="wszystkie">Wszystkie</button>
    <button class="sub-btn" data-sub="napoje-alkoholowe">Napoje Alkoholowe</button>
  </div>

  <!-- ============================================================ -->
  <!-- MAIN CONTENT                                                  -->
  <!-- ============================================================ -->
  <main id="main-content">
    <div class="loading-state">Ladowanie...</div>
  </main>

  <!-- ============================================================ -->
  <!-- FOOTER                                                        -->
  <!-- ============================================================ -->
  <footer>
    <div class="footer-rule"><span></span><i>&#10022;</i><span></span></div>
    <p>Szlachecka Kuchnia &nbsp;&bull;&nbsp; Pan Tadeusz &nbsp;&bull;&nbsp; Adam Mickiewicz</p>
  </footer>

  <!-- ============================================================ -->
  <!-- SCRIPT                                                        -->
  <!-- ============================================================ -->
  <script>
    // ------------------------------------------------------------------
    // CATEGORY DEFINITIONS
    // Each id must match the filename in data/
    // ------------------------------------------------------------------
    var CATEGORIES = [
      { id: 'zupy',         label: 'Zupy'         },
      { id: 'dania-miesne', label: 'Dania Miesne'  },
      { id: 'ryby',         label: 'Ryby'          },
      { id: 'wedliny',      label: 'Wedliny'       },
      { id: 'napoje',       label: 'Napoje'        },
      { id: 'desery',       label: 'Desery'        },
    ];

    // ------------------------------------------------------------------
    // STATE
    // ------------------------------------------------------------------
    var state = {
      data:              {},
      activeCategory:    'zupy',
      activeSubcategory: 'wszystkie',
      loaded:            false,
    };

    // ------------------------------------------------------------------
    // LOAD ALL JSON FILES
    // ------------------------------------------------------------------
    function loadAll() {
      var promises = CATEGORIES.map(function(cat) {
        return fetch('data/' + cat.id + '.json')
          .then(function(r) { return r.ok ? r.json() : []; })
          .catch(function() { return []; })
          .then(function(data) {
            state.data[cat.id] = Array.isArray(data) ? data : [];
          });
      });

      Promise.all(promises).then(function() {
        state.loaded = true;
        render();
      });
    }

    // ------------------------------------------------------------------
    // RENDER
    // ------------------------------------------------------------------
    function render() {
      var main = document.getElementById('main-content');
      var catId = state.activeCategory;
      var items = state.data[catId] || [];

      if (catId === 'napoje' && state.activeSubcategory === 'napoje-alkoholowe') {
        items = items.filter(function(d) {
          return d.subcategory === 'napoje-alkoholowe';
        });
      }

      if (items.length === 0) {
        main.innerHTML = '<p class="empty-state">Brak pozycji w tej kategorii.</p>';
        return;
      }

      var cat = CATEGORIES.find(function(c) { return c.id === catId; });
      var html = '<div class="category-header">'
               + '  <h2>' + cat.label + '</h2>'
               + '  <div class="category-header-line"></div>'
               + '</div>';

      items.forEach(function(dish) {
        html += buildCard(dish);
      });

      main.innerHTML = html;
    }

    function buildCard(dish) {
      var imgHtml;
      if (dish.image) {
        imgHtml = '<div class="dish-image-wrap">'
                + '  <img class="dish-image" src="' + dish.image + '" alt="' + escHtml(dish.name) + '" loading="lazy">'
                + '</div>';
      } else {
        imgHtml = '<div class="dish-image-placeholder">'
                + '  <span>Brak zdjecia</span>'
                + '</div>';
      }

      var refHtml = dish.reference
        ? '<div class="dish-reference">' + escHtml(dish.reference) + '</div>'
        : '';

      return '<article class="dish-card">'
           + '  <h3 class="dish-name">' + escHtml(dish.name) + '</h3>'
           + '  <div class="dish-body">'
           + '    <div class="dish-left">'
           + '      <p class="dish-description">' + escHtml(dish.description) + '</p>'
           + '      ' + refHtml
           + '    </div>'
           + '    ' + imgHtml
           + '  </div>'
           + '</article>';
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ------------------------------------------------------------------
    // NAV EVENTS
    // ------------------------------------------------------------------
    document.getElementById('main-nav').addEventListener('click', function(e) {
      var btn = e.target.closest('.nav-btn');
      if (!btn) return;

      var category = btn.dataset.category;
      if (category === state.activeCategory) return;

      document.querySelectorAll('.nav-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');

      state.activeCategory    = category;
      state.activeSubcategory = 'wszystkie';

      var subNav = document.getElementById('sub-nav');
      if (category === 'napoje') {
        subNav.classList.add('visible');
        document.querySelectorAll('.sub-btn').forEach(function(b) {
          b.classList.remove('active');
        });
        document.querySelector('.sub-btn[data-sub="wszystkie"]').classList.add('active');
      } else {
        subNav.classList.remove('visible');
      }

      if (state.loaded) render();
    });

    document.getElementById('sub-nav').addEventListener('click', function(e) {
      var btn = e.target.closest('.sub-btn');
      if (!btn) return;
      if (btn.dataset.sub === state.activeSubcategory) return;

      document.querySelectorAll('.sub-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');

      state.activeSubcategory = btn.dataset.sub;
      if (state.loaded) render();
    });

    // ------------------------------------------------------------------
    // INIT
    // ------------------------------------------------------------------
    loadAll();
  </script>

</body>
</html>
